name: Build and release
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install -r macos/requirements-build.txt
      - run: python -m unittest discover -s macos/backend -p 'test_*.py'
      - run: python scripts/check-public.py
      - run: python macos/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/linkbox-macos-arm64.zip
            dist/linkbox-macos-arm64.zip.sha256
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
        working-directory: windows
      - run: npm test
        working-directory: windows
      - run: npm run package
        working-directory: windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/linkbox-windows-x64.zip
            dist/linkbox-windows-x64.zip.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "链路盒子 $RELEASE_TAG" --notes-file "docs/release-$RELEASE_TAG.md"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
